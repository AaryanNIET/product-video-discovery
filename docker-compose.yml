# One command: `docker compose up --build`, then open http://localhost:8080
# Keys are read from backend/.env (copy backend/.env.example first). Without it
# the stack still starts, and the dashboard explains which keys are missing.
services:
  mongo:
    image: mongo:7
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Overrides for the container network (take precedence over backend/.env)
      MONGODB_URI: mongodb://mongo:27017/product-video-discovery
      CLIENT_ORIGIN: http://localhost:8080
      PORT: "4000"
    volumes: ["media-cache:/app/storage"]
    depends_on:
      mongo:
        condition: service_healthy
    ports: ["4000:4000"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["8080:80"]

volumes:
  mongo-data:
  media-cache:
